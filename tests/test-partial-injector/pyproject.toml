[project]
name = "partial-injector-tests"
version = "0.0.0"
description = "partial-injector unit tests"
license = { text = "MIT" }
authors = [{ name = "Kostiantyn Chomakov", email = "kostiantyn.chomakov@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "faker>=37.1.0",
  "partial-injector",
]

[tool.uv.sources]
partial-injector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_partial_injector"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv", "dist", "build", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["partial_injector", "test_partial_injector"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
addopts = "--import-mode=importlib"
testpaths = ["test_partial_injector"]
