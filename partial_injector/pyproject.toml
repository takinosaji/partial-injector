[tool.poetry]
name = "partial-injector"
version = "3.2.5"
description = "Dependency Injection for FP"
authors = ["Kostiantyn Chomakov <kostiantyn.chomakov@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/takinosaji/partial-injector"
repository = "https://github.com/takinosaji/partial-injector"

packages = [
    { include = "partial_injector", from = "src" }
]

exclude = ["*.lock", "*.toml", "README.md", "LICENSE"]
include = ["CHANGELOG.md"]

classifiers = [
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent'
]

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.dev.dependencies]
python = "^3.14"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
faker = "^37.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
