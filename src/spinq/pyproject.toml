[project]
name = "spinq"
version = "1.5.0"
description = "Simple LINQ in Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kostiantyn Chomakov", email = "kostiantyn.chomakov@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/takinosaji/partial-injector"
Repository = "https://github.com/takinosaji/partial-injector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spinq"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv", "dist", "build", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["spinq"]
